version: 1
name: Driver no-show at start of day
target: demo
setup:
  fixture: ./fixtures/day-55-drivers.json
events:
  - step: 1
    type: driver_no_show
    params: { driver: D03, at: '08:00' }
wait:
  until: { replan_status: completed }
  timeoutSeconds: 60
  pollSeconds: 2
invariants:
  - no_order_lost
  - single_assignment
  - affected_reassigned
  - capacity_respected
  - eta_updated_for_affected
  - customer_notified_for_affected
  - { sla_window_violations: { max: 0 } }
afterwards:
  parity: ../parity-scenario.yaml

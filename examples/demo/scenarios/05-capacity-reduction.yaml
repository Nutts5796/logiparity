version: 1
name: Vehicle capacity reduction
target: demo
setup:
  fixture: ./fixtures/day-55-drivers.json
events:
  - step: 1
    type: capacity_change
    params: { vehicle: V08, capacity: 25, at: '2026-11-02T14:50:00Z' }
wait:
  until: { replan_status: completed }
  timeoutSeconds: 60
  pollSeconds: 2
invariants:
  - no_order_lost
  - single_assignment
  - capacity_respected
  - eta_updated_for_affected
  - customer_notified_for_affected
  - { sla_window_violations: { max: 0 } }
afterwards:
  parity: ../parity-scenario.yaml

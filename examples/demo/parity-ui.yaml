# Test and staging only. Run demo:export and demo:login before this check.
version: 1
environment: test
entities:
  - name: shipment
    label: Order
    pluralLabel: orders
    key: shipment_id
    sources:
      api: # First source is the reference.
        type: rest
        label: API
        baseUrl: ${DEMO_API_URL}
        path: /api/shipments?date={{date}}
        pagination: { type: page, totalPath: $.pagination.total, pageParam: page, sizeParam: limit, size: 200 }
        items: $.data[*]
        fields:
          shipment_id: $.id
          status: $.status
          payout: { path: $.driver_payout, label: Driver payout }
          delivered_at: { path: $.delivered_at, label: Delivery time }
      export:
        type: xlsx
        label: Excel export
        file: ./out/shipments-{{date}}.xlsx
        sheet: Shipments
        headerRow: 1
        fields: { shipment_id: 'Shipment ID', status: Status, payout: 'Driver payout', delivered_at: 'Delivered at' }
      csv:
        type: csv
        label: CSV export
        file: ./out/shipments-{{date}}.csv
        fields: { shipment_id: 'Shipment ID', status: Status, payout: 'Driver payout', delivered_at: 'Delivered at' }
      ui:
        type: ui
        label: Dispatcher
        url: ${DEMO_UI_URL}/dispatcher?date={{date}}
        storageState: ./auth/state.json
        table: 'table#shipments'
        nextPage: "button[aria-label='Next page']"
        fields:
          shipment_id: '[data-col=id]'
          status: '[data-col=status]'
          payout: '[data-col=payout]'
          delivered_at: 'td[data-col=delivered_at] .parity-time'
    compare:
      status: { type: enum, map: { 'In transit': in_transit, Delivered: delivered } }
      payout: { type: money, currency: USD, allowCurrencySymbol: true, tolerance: 0 }
      delivered_at:
        type: datetime
        format: { ui: "h:mm a'\n'LLL d, yyyy" }
        sourceTimezones: { export: UTC, csv: UTC, ui: America/Chicago }
        toleranceSeconds: 60
    aggregates:
      - { name: delivered_count, label: Delivered orders, type: count, where: { status: delivered } }
      - { name: payout_total, label: Total driver payout, type: sum, field: payout }
    failOn: [missing, extra, mismatch, aggregate, duplicate]
variables:
  date: '2026-11-02'
report:
  outputs: [console, html, junit, json, markdown]
  dir: ../../logiparity-report

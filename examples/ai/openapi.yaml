# Handwritten synthetic OpenAPI input for AI preview; not fetched from a live system.
openapi: 3.1.0
info:
  title: Synthetic shipment API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:3010
paths:
  /api/shipments:
    get:
      operationId: listShipments
      summary: Paginated synthetic shipments
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10000 } }
      responses:
        '200':
          description: A page of synthetic shipment records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Shipment' }
components:
  schemas:
    Shipment:
      type: object
      properties:
        id: { type: string, example: S000801 }
        status: { type: string, enum: [in_transit, delivered, cancelled] }
        customer_id: { type: string, example: C000801 }
        driver_payout:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: Decimal USD amount as text; compare using exact minor units
          example: '6.25'
        delivered_at: { type: [string, 'null'], format: date-time }
        eta: { type: string, format: date-time }

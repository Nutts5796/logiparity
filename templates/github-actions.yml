# Copy to .github/workflows/logiparity.yml. Prepare parity.yaml and a current CSV export.
name: Staging data parity
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  # pull_request: # Opt in only for an isolated test target.
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: Install LogiParity
        run: npm install --no-save --ignore-scripts logiparity@1.0.1
      # For UI: node node_modules/logiparity/node_modules/playwright/cli.js install --with-deps chromium
      - name: Validate without secrets or source reads
        run: ./node_modules/.bin/logiparity validate --allow-missing-env --config parity.yaml
      - name: Download the current staging export
        env:
          STAGING_API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
        run: >-
          curl --fail --silent --show-error
          -H "Authorization: Bearer $STAGING_API_TOKEN"
          "$STAGING_API_URL/exports/shipments.csv" --output shipments.csv
      - name: Compare staging sources
        env:
          STAGING_API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
        run: |
          set +e
          ./node_modules/.bin/logiparity check --config parity.yaml
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then echo '::error::Data findings'; fi
          if [ "$code" -eq 2 ]; then echo '::error::Source or configuration error'; fi
          exit "$code"
      - name: Retain reports after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logiparity-report
          path: logiparity-report/
          retention-days: 7
          if-no-files-found: warn

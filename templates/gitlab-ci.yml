# include: this file, then define a visible job with extends: .logiparity.
# Select the stage in your own pipeline. This include never defines stages.
# Set protected LOGIPARITY_IMAGE to a verified digest-pinned version reference.
.logiparity:
  image:
    name: $LOGIPARITY_IMAGE
    entrypoint: ['']
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      node --input-type=module <<'JS'
      import {execFileSync} from 'node:child_process';
      const match=process.env.LOGIPARITY_IMAGE.match(/:(\d+\.\d+\.\d+)(?:-slim)?@sha256:[a-f0-9]{64}$/);
      if(!match || execFileSync('logiparity',['--version'],{encoding:'utf8'}).trim()!==match[1]) throw new Error('Set a verified digest-pinned LOGIPARITY_IMAGE with its matching CLI version');
      JS
    - logiparity validate --allow-missing-env --config parity.yaml
    - >-
      curl --max-time 60 --retry 3 --fail --silent --show-error
      -H "Authorization: Bearer $STAGING_API_TOKEN"
      "$STAGING_API_URL/exports/shipments.csv" --output shipments.csv
    - logiparity check --config parity.yaml
  artifacts:
    when: always
    expire_in: 7 days
    paths: [logiparity-report/]
    reports:
      junit: logiparity-report/junit.xml

# Consumer template. Copy into .gitlab-ci.yml after the owner publishes 1.0.0.
# Set protected/masked STAGING_API_URL and STAGING_API_TOKEN CI variables; use test/staging only.
# Prepare the CSV/XLSX inputs referenced by parity.yaml before running this job.
stages: [test]
logiparity:
  stage: test
  image: node:22.23.4-bookworm-slim
  before_script:
    - npm install --no-save --ignore-scripts logiparity@1.0.0
    # For UI, add: node node_modules/logiparity/node_modules/playwright/cli.js install --with-deps chromium
  script:
    - ./node_modules/.bin/logiparity check --config parity.yaml
  artifacts:
    when: always
    expire_in: 7 days
    paths: [logiparity-report/]
    reports:
      junit: logiparity-report/junit.xml
  # Exit 1 (findings) and exit 2 (configuration/runtime errors) both fail this job.

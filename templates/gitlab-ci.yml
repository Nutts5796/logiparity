# Copy to .gitlab-ci.yml. Set protected staging URL/token CI variables.
# Replace the placeholder via LOGIPARITY_IMAGE with the verified 1.0.1 slim index digest.
# docs/release.md tracks the follow-up commit after publication. Do not use the 1.0.0 image.
stages: [test]
variables:
  LOGIPARITY_IMAGE: "ghcr.io/nutts5796/logiparity:1.0.1-slim@sha256:REPLACE_WITH_VERIFIED_1_0_1_SLIM_DIGEST"
logiparity:
  stage: test
  image:
    name: $LOGIPARITY_IMAGE
    entrypoint: [""]
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    # Opt in only for isolated targets: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - test "$(logiparity --version)" = '1.0.1'
    - logiparity validate --allow-missing-env --config parity.yaml
    - |
      node --input-type=module <<'JS'
      import { writeFile } from 'node:fs/promises';
      const response = await fetch(`${process.env.STAGING_API_URL}/exports/shipments.csv`, {headers: {Authorization: `Bearer ${process.env.STAGING_API_TOKEN}`}, redirect: 'error', signal: AbortSignal.timeout(30000)});
      if (!response.ok) throw new Error(`Export HTTP ${response.status}`);
      await writeFile('shipments.csv', new Uint8Array(await response.arrayBuffer()));
      JS
    - logiparity check --config parity.yaml
  artifacts:
    when: always
    expire_in: 7 days
    paths: [logiparity-report/]
    reports:
      junit: logiparity-report/junit.xml

# Copy to .gitlab-ci.yml. Configure protected staging URL/token variables.
# A schedule must be created in GitLab; web means a manual pipeline launch.
stages: [test]
logiparity:
  stage: test
  image: node:22.23.4-bookworm-slim@sha256:REPLACE_WITH_VERIFIED_IMAGE_DIGEST # Replace before use.
  timeout: 15m
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key: logiparity-npm
    paths: [.npm/]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    # Opt in only for isolated targets: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl
    - |
      base=https://github.com/Nutts5796/logiparity/releases/download/v1.0.0
      curl --fail --silent --show-error --location "$base/logiparity-1.0.0.tgz" --output logiparity-1.0.0.tgz
      curl --fail --silent --show-error --location "$base/logiparity-1.0.0.tgz.sha256" --output logiparity-1.0.0.tgz.sha256
      sha256sum --check logiparity-1.0.0.tgz.sha256
      npm install --no-save --ignore-scripts ./logiparity-1.0.0.tgz
    # After npm publication: npm install --no-save --ignore-scripts logiparity@1.0.0
  script:
    - >-
      curl --fail --silent --show-error -H "Authorization: Bearer $STAGING_API_TOKEN"
      "$STAGING_API_URL/exports/shipments.csv" --output shipments.csv
    - |
      set +e
      ./node_modules/.bin/logiparity check --config parity.yaml
      code=$?
      set -e
      if [ "$code" -eq 1 ]; then echo 'Data findings'; fi
      if [ "$code" -eq 2 ]; then echo 'Source or configuration error'; fi
      exit "$code"
  artifacts:
    when: always
    expire_in: 7 days
    paths: [logiparity-report/]
    reports:
      junit: logiparity-report/junit.xml

name: Versioned release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag; select this exact tag as the workflow ref
        required: true
        type: string
permissions: {}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/nutts5796/logiparity
jobs:
  verify:
    needs: lookup
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag || github.ref }}
  lookup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - name: Guard the release ref before any checkout
        env:
          REF: ${{ github.ref }}
        run: |
          test "$REF" = "refs/tags/$TAG"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - id: release
        name: Read draft metadata and download existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p output/release
          if gh release view "$TAG" --repo "$REPOSITORY" --json assets,body > output/release/release-metadata.json 2> lookup-error.txt; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
            version="${TAG#v}"
            for file in "logiparity-$version.tgz" "logiparity-$version.tgz.sha256" "logiparity-$version.cdx.json" "logiparity-offline-$version.tgz" "logiparity-offline-$version.tgz.sha256"; do
              if ! jq -e --arg file "$file" '.assets | any(.name == $file)' output/release/release-metadata.json > /dev/null; then
                printf 'Existing release is missing asset: %s\n' "$file" >&2
                exit 1
              fi
              gh release download "$TAG" --repo "$REPOSITORY" --pattern "$file" --dir output/release
            done
          elif grep -Eqi 'release not found|HTTP 404' lookup-error.txt; then
            printf '{}\n' > output/release/release-metadata.json
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          else
            cat lookup-error.txt >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-lookup
          path: output/release/
          retention-days: 1
  build:
    needs: [verify, lookup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      reused: ${{ steps.prepare.outputs.reused }}
    steps:
      - name: Require an exact tag ref for image-only retries
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = "refs/tags/$TAG"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          test "$TAG" = "v$version"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-lookup, path: output/release }
      - name: Verify existing provenance before reuse
        if: needs.lookup.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          revision=$(git rev-parse HEAD)
          for file in output/release/*.tgz output/release/*.cdx.json; do
            gh attestation verify "$file" --repo "$REPOSITORY" --signer-workflow "$REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/$TAG" --source-digest "$revision"
          done
      - id: prepare
        name: Verify downloaded assets or prepare a new release
        env:
          IMAGE_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/release-build.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: output/release/
          retention-days: 14
  attest:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-files, path: output/release }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            output/release/*.tgz
            output/release/*.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: output/release/logiparity-${{ needs.build.outputs.version }}.tgz
          sbom-path: output/release/logiparity-${{ needs.build.outputs.version }}.cdx.json
  draft:
    needs: [build, attest]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.attest.result == 'success' || needs.build.outputs.reused == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TAG }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-files, path: output/release }
      - name: Create draft or verify identical existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/publish-release.mjs github
  npm:
    environment: npm
    needs: [build, draft]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.draft.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TAG }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4', registry-url: 'https://registry.npmjs.org' }
      - run: npm install --global npm@11.6.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-files, path: output/release }
      - run: node scripts/publish-release.mjs npm
  images:
    needs: [build, draft, npm]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.draft.result == 'success' && (needs.npm.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: write
      id-token: write
      attestations: write
      contents: read
    strategy:
      matrix:
        include:
          - { target: runtime, suffix: '' }
          - { target: slim, suffix: '-slim' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TAG }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-files, path: output/release }
      - name: Verify npm integrity without publishing on manual retries
        if: github.event_name == 'workflow_dispatch'
        env: { IMAGE_ONLY: 'true' }
        run: node scripts/publish-release.mjs npm
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: image
        name: Preserve existing image digests or build from the verified tarball
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: node scripts/build-release-image.mjs
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.image.outputs.needs-attestation == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.target }}
          path: output/release/${{ matrix.target }}-image.json
  notes:
    needs: [build, npm, images]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.images.result == 'success' && (needs.npm.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TAG }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-files, path: output/release }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'image-*', path: output/release, merge-multiple: true }
      - name: Record digests, then publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          full=$(node -p "require('./output/release/runtime-image.json')['containerimage.digest']")
          slim=$(node -p "require('./output/release/slim-image.json')['containerimage.digest']")
          node scripts/release-image-notes.mjs "$VERSION" "$IMAGE" "$full" "$slim"
          gh release edit "$TAG" --notes-file output/release/notes.md --draft=false

name: Versioned release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag; select this exact tag as the workflow ref
        required: true
        type: string
permissions: {}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/nutts5796/logiparity
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag || github.ref }}
  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Require an exact tag ref for image-only retries
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = "refs/tags/$TAG"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          test "$TAG" = "v$version"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Reuse and verify existing release assets; build only for a new tag
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/release-build.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: output/release/
          retention-days: 14
  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-files, path: output/release }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            output/release/*.tgz
            output/release/*.cdx.json
  draft:
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TAG }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-files, path: output/release }
      - name: Create draft or verify identical existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/publish-release.mjs github
  npm:
    environment: npm
    needs: [build, draft]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TAG }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4', registry-url: 'https://registry.npmjs.org' }
      - run: npm install --global npm@11.6.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-files, path: output/release }
      - run: node scripts/publish-release.mjs npm
  images:
    needs: [build, draft, npm]
    if: always() && needs.draft.result == 'success' && (needs.npm.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: write
      id-token: write
      attestations: write
      contents: read
    strategy:
      matrix:
        include:
          - { target: runtime, suffix: '' }
          - { target: slim, suffix: '-slim' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TAG }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-files, path: output/release }
      - name: Verify npm integrity without publishing on manual retries
        if: github.event_name == 'workflow_dispatch'
        env: { IMAGE_ONLY: 'true' }
        run: node scripts/publish-release.mjs npm
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: image
        name: Preserve existing image digests or build from the verified tarball
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: node scripts/build-release-image.mjs
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.image.outputs.reused != 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.target }}
          path: output/release/${{ matrix.target }}-image.json
  notes:
    needs: [build, npm, images]
    if: always() && needs.images.result == 'success' && (needs.npm.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TAG }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-files, path: output/release }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'image-*', path: output/release, merge-multiple: true }
      - name: Record digests, then publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          full=$(node -p "require('./output/release/runtime-image.json')['containerimage.digest']")
          slim=$(node -p "require('./output/release/slim-image.json')['containerimage.digest']")
          node scripts/release-image-notes.mjs "$VERSION" "$IMAGE" "$full" "$slim"
          gh release edit "$TAG" --notes-file output/release/notes.md --draft=false

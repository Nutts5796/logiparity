name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: logiparity_test
          POSTGRES_USER: logiparity_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logiparity_test -d logiparity_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOGIPARITY_TEST_DATABASE_URL: postgres://logiparity_test@127.0.0.1:5432/logiparity_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install offline JUnit schema validator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

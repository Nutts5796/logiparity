name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: logiparity_test
          POSTGRES_USER: logiparity_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logiparity_test -d logiparity_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOGIPARITY_TEST_DATABASE_URL: postgres://logiparity_test@127.0.0.1:5432/logiparity_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install offline JUnit schema validator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run check:docs
      - name: Verify the standalone npm artifact
        run: npm run test:package
        env:
          LOGIPARITY_PACK_OUTPUT: output/release-checks/package-${{ matrix.node }}.json
      - name: Verify a clean-source quickstart
        run: npm run test:quickstart
        env:
          LOGIPARITY_QUICKSTART_OUTPUT: output/release-checks/quickstart-${{ matrix.node }}.json
      - name: Retain local validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-node-${{ matrix.node }}
          path: output/release-checks/
          retention-days: 7
          if-no-files-found: warn
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm run test:docker

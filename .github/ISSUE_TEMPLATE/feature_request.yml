name: Feature request
description: Propose a test/staging use case or an adapter improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      { label: Problem and use case, description: 'Describe the workflow and why existing features are insufficient.' }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      { label: Proposed behavior, description: 'Include a small synthetic example and alternatives considered.' }
    validations: { required: true }
  - type: textarea
    id: validation
    attributes:
      { label: Validation and scope, description: 'How can we verify it with synthetic test/staging fixtures?' }
